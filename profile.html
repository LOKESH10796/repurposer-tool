<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loki | Repurposer AI</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    /* Subtle radial glow */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 3.5rem 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.04),
        0 24px 80px rgba(0, 0, 0, 0.6),
        0 0 120px rgba(99, 102, 241, 0.06);
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      border: 2px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
      margin-bottom: 0.15rem;
    }

    .handle {
      color: #777799;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .bio {
      color: #9999b0;
      font-size: 0.95rem;
      line-height: 1.65;
      margin-bottom: 2rem;
    }

    .cta-button {
      display: inline-block;
      background: #6366f1;
      color: #fff;
      padding: 1rem 2.25rem;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: -0.01em;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35);
    }

    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.5);
    }

    .subscribe-section {
      margin-top: 2.25rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .subscribe-section p {
      color: #666680;
      font-size: 0.8rem;
      margin-bottom: 1rem;
    }

    .email-form {
      display: flex;
      gap: 0.5rem;
    }

    .email-form input[type="email"] {
      flex: 1;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: #e0e0e0;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .email-form input[type="email"]:focus {
      border-color: #6366f1;
    }

    .email-form input[type="email"]::placeholder {
      color: #555570;
    }

    .email-form button {
      padding: 0.7rem 1.2rem;
      border-radius: 8px;
      border: none;
      background: #6366f1;
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .email-form button:hover {
      background: #5558e6;
    }

    .hidden {
      display: none;
    }

    footer {
      margin-top: 2rem;
      color: #444460;
      font-size: 0.7rem;
    }

    @media (max-width: 480px) {
      .card {
        padding: 2.5rem 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      .bio {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">
      <img src="https://api.dicebear.com/7.x/bottts/png?seed=RepurposerAI&backgroundColor=151515&baseColor=7a8c59" alt="Loki" />
    </div>
    <h1>Loki</h1>
    <div class="handle">@Repurposer AI</div>
    <p class="bio">
      I build high-speed, no-bs AI tools for creators.<br />
      Pay once, own it forever.
    </p>
    <a href="https://loki1996.gumroad.com/l/repurposer" class="cta-button">
      Get Lifetime Access
    </a>
    <div class="subscribe-section">
      <p>Join the list — no spam, just the good stuff.</p>
      <form data-gumroad-follow>
        <input type="email" placeholder="Your best email" required />
        <button type="submit">Subscribe</button>
      </form>
      <div data-gumroad-follow-message class="hidden" style="color: #6366f1; font-size: 0.85rem; margin-top: 0.5rem;">
        You're on the list!
      </div>
    </div>
    <footer>© 2026 Loki</footer>
  </div>
</body>
</html>
